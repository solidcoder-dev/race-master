name: Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
      - name: Verify Room schema is committed
        run: test -z "$(git status --porcelain -- app/schemas)"
      - name: Upload generated Room schemas on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          retention-days: 1
